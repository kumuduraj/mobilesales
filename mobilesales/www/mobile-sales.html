<!doctype html>
<html lang="{{ boot.lang if boot else 'en' }}">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#1f2937" />
		<link rel="icon" href="/assets/mobilesales/frontend/icons/icon-192.png" />
		<link rel="apple-touch-icon" href="/assets/mobilesales/frontend/icons/icon-192.png" />
		<title>Mobile Sales</title>
		<script type="module" crossorigin src="/assets/mobilesales/frontend/assets/index-BkErV3bm.js"></script>
		<link rel="stylesheet" crossorigin href="/assets/mobilesales/frontend/assets/index-BRgr5OCg.css">
	<link rel="manifest" href="/assets/mobilesales/frontend/manifest.webmanifest"></head>
	<body>
		{% if not_allowed %}
		<div style="font-family: sans-serif; max-width: 420px; margin: 15vh auto; padding: 0 16px; text-align: center">
			<h2>Mobile Sales</h2>
			<p>{{ _("This app is only for mobile sales agents.") }}</p>
			<p><a href="/app">{{ _("Go to the desk") }}</a></p>
		</div>
		{% else %}
		<div id="app"></div>
		<script>
			window.ms_boot = {{ boot | tojson }};
			window.csrf_token = window.ms_boot.csrf_token;
			// Never a blank screen: bundle load errors, mount errors and a stuck start show the reason on screen.
			window.ms_fail = function (message) {
				var box = document.getElementById("ms-fail") || document.createElement("div");
				box.id = "ms-fail";
				box.setAttribute("role", "alert");
				box.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:9999;padding:12px 16px;background:#b91c1c;color:#fff;font:14px/1.4 sans-serif;white-space:pre-wrap";
				box.textContent = "App failed to load — " + message;
				document.body.appendChild(box);
			};
			window.addEventListener("error", function (e) {
				if (!window.ms_mounted) window.ms_fail(e.message || ("could not load " + ((e.target && (e.target.src || e.target.href)) || "a file")));
			}, true);
			window.addEventListener("unhandledrejection", function (e) {
				if (!window.ms_mounted) window.ms_fail((e.reason && e.reason.message) || String(e.reason));
			});
			setTimeout(function () {
				if (!window.ms_mounted) window.ms_fail("the app did not start. Close it and open it again.");
			}, 20000);
		</script>
		{% endif %}
	</body>
</html>
